<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:LB;src:url(fonts/libre-baskerville-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:LB;src:url(fonts/libre-baskerville-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:LB;src:url(fonts/libre-baskerville-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:MS;src:url(fonts/montserrat-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:MS;src:url(fonts/montserrat-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:MS;src:url(fonts/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:MS;src:url(fonts/montserrat-latin-800-normal.woff2);font-weight:800}
:root{--navy:#0f2a5c;--navy2:#0a1f47;--or:#e8a62b;--creme:#f5f0e6;--texte:#1d2a44}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:var(--navy)}
#ecran{position:relative;width:720px;height:1280px;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0}
.nuit{background:radial-gradient(ellipse at 50% 35%,#16397a 0%,var(--navy) 55%,var(--navy2) 100%)}
.creme{background:var(--creme)}
canvas.etoiles{position:absolute;inset:0}
.filigrane{position:absolute;left:50%;bottom:120px;width:420px;height:420px;transform:translateX(-50%);opacity:.06}
.entete{position:absolute;top:56px;left:56px;right:56px;text-align:center}
.entete .marque{display:inline-flex;align-items:center;gap:12px;font:700 19px MS;letter-spacing:.14em;color:var(--navy)}
.entete .marque svg{width:34px;height:34px}
.barre{margin-top:22px;height:4px;background:#e3dccd;border-radius:2px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--or);width:0}
.corps{position:absolute;top:190px;left:56px;right:56px}
h1.t{font:700 54px/1.18 LB;color:var(--navy);text-align:center}
.trait{width:70px;height:4px;background:var(--or);margin:26px auto 0;border-radius:2px}
.app{opacity:0}
.q-texte{margin-top:70px;font:italic 400 40px/1.45 LB;color:var(--texte);text-align:center}
.item{display:flex;gap:22px;align-items:center;background:#fffdf8;border:2px solid var(--navy);border-radius:20px;padding:24px 26px;margin-top:22px}
.num{flex:0 0 64px;height:64px;border-radius:50%;background:var(--or);color:var(--navy);font:800 30px MS;display:flex;align-items:center;justify-content:center}
.item b{display:block;font:700 33px/1.2 LB;color:var(--navy)}
.item span{display:block;margin-top:6px;font:500 24px/1.35 MS;color:#3a4763}
.bloc{background:#fffdf8;border-left:8px solid var(--or);border-radius:14px;padding:20px 24px;margin-top:20px;box-shadow:0 2px 0 #e3dccd}
.bloc b{display:block;font:800 20px MS;letter-spacing:.14em;color:var(--or);text-transform:uppercase}
.bloc span{display:block;margin-top:8px;font:500 27px/1.4 MS;color:var(--texte)}
.bloc.fort{background:var(--navy)}
.bloc.fort span{color:#fff;font-weight:700}
.citation{margin-top:46px;background:#fffdf8;border:2px solid var(--navy);border-radius:20px;padding:36px 34px;position:relative}
.citation:before{content:"«";position:absolute;top:-34px;left:26px;font:700 80px LB;color:var(--or)}
.citation p{font:italic 400 33px/1.5 LB;color:var(--texte)}
.cas{display:flex;gap:20px;align-items:flex-start;background:#fffdf8;border-radius:20px;padding:26px;margin-top:26px;border:2px solid}
.cas.ok{border-color:#2e7d4f}.cas.non{border-color:#b23a2b}
.cas .ic{flex:0 0 60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 34px MS;color:#fff}
.cas.ok .ic{background:#2e7d4f}.cas.non .ic{background:#b23a2b}
.cas b{display:block;font:800 22px MS;letter-spacing:.12em;text-transform:uppercase}
.cas.ok b{color:#2e7d4f}.cas.non b{color:#b23a2b}
.cas span{display:block;margin-top:8px;font:500 28px/1.4 MS;color:var(--texte)}
.alerte{width:120px;height:110px;margin:30px auto 0}
.pg{background:#fffdf8;border:2px solid var(--or);border-radius:20px;padding:24px 28px;margin-top:22px;text-align:center}
.pg b{display:block;font:700 34px/1.25 LB;color:var(--navy)}
.pg span{display:block;margin-top:10px;font:500 26px/1.4 MS;color:#3a4763}
/* intro et fin */
.centre{position:absolute;left:0;right:0;text-align:center}
.logo-grand{width:230px;height:230px;margin:0 auto}
.serie{font:700 24px MS;letter-spacing:.2em;color:var(--or);margin-top:30px}
.filet{width:110px;height:3px;background:var(--or);margin:20px auto 0}
.titre-intro{font:700 64px/1.18 LB;color:#fff;margin:56px 50px 0}
.rub{display:inline-block;margin-top:34px;font:700 22px MS;letter-spacing:.14em;color:var(--navy);background:var(--or);padding:10px 22px;border-radius:30px;text-transform:uppercase}
.nom{font:700 58px/1.15 LB;color:#fff;margin-top:26px}
.devise{font:700 20px/1.6 MS;letter-spacing:.2em;color:var(--or);margin-top:22px}
.mission{font:italic 400 34px LB;color:#fff;margin-top:34px}
.wa{margin:40px 70px 0;background:var(--or);border-radius:24px;padding:26px 20px;box-shadow:0 0 0 6px rgba(232,166,43,.25)}
.wa small{display:block;font:800 19px MS;letter-spacing:.14em;color:var(--navy)}
.wa div{font:800 44px/1.35 MS;color:var(--navy);margin-top:8px}
.enligne{font:500 22px MS;color:#d6dcea;margin-top:22px}
/* sous-titres */
#st{position:absolute;left:40px;right:40px;bottom:150px;text-align:center;opacity:0}
#st span{display:inline-block;background:var(--navy);color:#fff;font:700 31px/1.35 MS;padding:14px 24px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#st em{font-style:normal;color:var(--or)}
.nuit ~ #st span{background:rgba(10,31,71,.85)}
</style></head>
<body><div id="ecran"></div>
<script>
const LOGO=(clair)=>`<svg viewBox="0 0 100 100"><g transform="translate(6 2) scale(.88)"><path fill="#e8a62b" d="M30 3C31.2 11 33 12.8 41 14 33 15.2 31.2 17 30 25 28.8 17 27 15.2 19 14 27 12.8 28.8 11 30 3Z"/><path fill="${clair?'#fff':'#0f2a5c'}" d="M12 84V50C12 35 24 26 40 26H45V34H41C30 34 21.5 41 21.5 51V84Z"/><path fill="#e8a62b" d="M45 26 57 30V87L45 84Z"/><path fill="${clair?'#fff':'#0f2a5c'}" d="M57 30 73 27V88L57 87Z"/><circle fill="${clair?'#0f2a5c':'#f5f0e6'}" cx="61.5" cy="58" r="2.3"/><path fill="${clair?'#fff':'#0f2a5c'}" d="M77 25H82V88H77Z"/><path fill="#e8a62b" d="M4 95C30 82 70 82 96 95 70 88.5 30 88.5 4 95Z"/></g></svg>`;
const ALERTE=`<svg viewBox="0 0 120 110"><path d="M60 6 116 104H4Z" fill="#e8a62b" stroke="#0f2a5c" stroke-width="6" stroke-linejoin="round"/><rect x="54" y="38" width="12" height="38" rx="5" fill="#0f2a5c"/><circle cx="60" cy="89" r="7" fill="#0f2a5c"/></svg>`;
let D,T,scenes=[],st;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const marque=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
function etoiles(c){const x=c.getContext('2d');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;c._p=[...Array(140)].map(()=>[r()*720,r()*1280,r()*1.8+.4,r()*6.28]);}
function dessineEtoiles(c,t){const x=c.getContext('2d');x.clearRect(0,0,720,1280);for(const[a,b,z,p]of c._p){x.globalAlpha=.25+.55*(.5+.5*Math.sin(t*1.6+p));x.fillStyle='#fff';x.beginPath();x.arc(a,b,z,0,6.283);x.fill();}}
function construit(sc,i){
  const d=document.createElement('div');d.className='scene';
  const it=(o,html,cls='')=>`<div class="app ${cls}" data-cue="${o.cue??0}">${html}</div>`;
  if(sc.type==='intro'){d.classList.add('nuit');d.innerHTML=`<canvas class="etoiles" width="720" height="1280"></canvas><div class="centre" style="top:250px"><div class="logo-grand">${LOGO(true)}</div><div class="serie">UNE NOTION, UNE MINUTE</div><div class="filet"></div><div class="app" data-cue="1"><div class="titre-intro">${esc(sc.titre)}</div><div class="rub">${esc(D.rubrique)}</div></div></div>`;}
  else if(sc.type==='outro'){d.classList.add('nuit');d.innerHTML=`<canvas class="etoiles" width="720" height="1280"></canvas><div class="centre" style="top:150px"><div class="logo-grand" style="width:200px;height:200px">${LOGO(true)}</div><div class="nom">Les Cours<br>Sésame et SAJ</div><div class="devise">FORMATION JURIDIQUE<br>CONCOURS &amp; EXCELLENCE</div><div class="app" data-cue="1"><div class="mission">Votre réussite est notre mission</div><div class="wa"><small>INSCRIPTIONS SUR WHATSAPP</small><div>01 60 86 05 37<br>05 06 60 03 32</div></div><div class="enligne">Cours entièrement en ligne · coursesesame.com</div></div></div>`;}
  else{
    d.classList.add('creme');let h='';
    if(sc.type==='question')h=`<div class="app" data-cue="${sc.cueTexte??1}"><p class="q-texte">${esc(sc.texte)}</p></div>`;
    if(sc.type==='etapes')h=sc.items.map(o=>it(o,`<div class="item"><div class="num">${o.n}</div><div><b>${esc(o.t)}</b>${o.d?`<span>${esc(o.d)}</span>`:''}</div></div>`)).join('');
    if(sc.type==='blocs')h=sc.items.map(o=>it(o,`<div class="bloc ${o.fort?'fort':''}"><b>${esc(o.t)}</b><span>${esc(o.d)}</span></div>`)).join('');
    if(sc.type==='article')h=`<div class="app" data-cue="${sc.cueCitation??1}"><div class="citation"><p>${esc(sc.citation)}</p></div></div>`;
    if(sc.type==='cas')h=sc.items.map(o=>it(o,`<div class="cas ${o.ok?'ok':'non'}"><div class="ic">${o.ok?'✓':'✗'}</div><div><b>${esc(o.t)}</b><span>${esc(o.d)}</span></div></div>`)).join('');
    if(sc.type==='piege')h=`<div class="alerte">${ALERTE}</div>`+sc.items.map(o=>it(o,`<div class="pg"><b>${esc(o.t)}</b><span>${esc(o.d)}</span></div>`)).join('');
    d.innerHTML=`<div class="filigrane">${LOGO(false)}</div><div class="entete"><div class="marque">${LOGO(false)}LES COURS SÉSAME ET SAJ</div><div class="barre"><i></i></div></div><div class="corps"><h1 class="t">${esc(sc.titre)}</h1><div class="trait"></div>${h}</div>`;
  }
  document.getElementById('ecran').appendChild(d);
  d.querySelectorAll('canvas.etoiles').forEach(etoiles);
  return d;
}
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
function rendu(t){
  const n=scenes.length;
  scenes.forEach((el,i)=>{
    const s=T.scenes[i];let op=0;
    if(t>=s.debut-0.0&&t<s.fin+0.4)op=Math.min(ease((t-s.debut)/0.4),i<n-1?1-ease((t-s.fin)/0.4):1);
    if(i===0&&t<0.4)op=1;
    el.style.opacity=op;el.style.display=op>0?'block':'none';
    if(op>0){
      el.querySelectorAll('.app').forEach(a=>{const c=+a.dataset.cue;const t0=s.phrases[Math.min(c,s.phrases.length-1)].debut-0.15;const k=ease((t-t0)/0.45);a.style.opacity=k;a.style.transform=`translateY(${(1-k)*26}px)`;});
      el.querySelectorAll('canvas.etoiles').forEach(c=>dessineEtoiles(c,t));
      const b=el.querySelector('.barre i');if(b)b.style.width=(100*Math.min(1,Math.max(0,(t-T.contenuDebut)/(T.contenuFin-T.contenuDebut))))+'%';
    }
  });
  let txt=null;
  for(const m of T.morceaux){if(t>=m.debut&&t<m.fin){txt=m.texte;break;}}
  if(txt!==st._t){st.innerHTML=txt?`<span>${marque(txt)}</span>`:'';st._t=txt;}
  st.style.opacity=txt?1:0;
}
async function charge(d,t){D=d;T=t;scenes=D.scenes.map(construit);st=document.createElement('div');st.id='st';document.getElementById('ecran').appendChild(st);await document.fonts.ready;rendu(0);return true;}
</script></body></html>
